name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: make test
      - run: make vet
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: make licenses
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- internal/workbench/dist THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          version="${tag#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="efficient-daemon_${version}_${goos}_${goarch}"
            ext=""
            [[ "$goos" == windows ]] && ext=".exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.version=$tag" \
              -o "dist/${name}${ext}" ./cmd/efficient-daemon
            package_dir="$(mktemp -d)"
            cp "dist/${name}${ext}" README.md LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
            cp -R THIRD_PARTY_LICENSES "$package_dir/"
            if [[ "$goos" == windows ]]; then
              (cd "$package_dir" && zip -q -j "$GITHUB_WORKSPACE/dist/${name}.zip" ./*)
            else
              tar -C "$package_dir" -czf "$GITHUB_WORKSPACE/dist/${name}.tar.gz" .
            fi
            rm -rf "$package_dir" "dist/${name}${ext}"
          done
          sha256sum dist/*.tar.gz dist/*.zip > dist/checksums.txt
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare container tags
        id: container-tags
        env:
          IMAGE: ghcr.io/beremaran/efficient-daemon
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          {
            echo 'tags<<EOF'
            echo "$IMAGE:$version"
            if [[ "$version" != *-* ]]; then
              echo "$IMAGE:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.container-tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/beremaran/efficient-daemon
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes --latest
