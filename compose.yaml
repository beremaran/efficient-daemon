services:
  efficient-daemon:
    build: .
    image: efficient-daemon:local
    ports:
      - "127.0.0.1:${EFFICIENT_DAEMON_PUBLISHED_PORT:-8080}:${EFFICIENT_DAEMON_PORT:-8080}"
    environment:
      EFFICIENT_DAEMON_HOST: "${EFFICIENT_DAEMON_HOST:-0.0.0.0}"
      EFFICIENT_DAEMON_PORT: "${EFFICIENT_DAEMON_PORT:-8080}"
      EFFICIENT_DAEMON_PROVIDER: "${EFFICIENT_DAEMON_PROVIDER:-}"
      EFFICIENT_DAEMON_BASE_URL: "${EFFICIENT_DAEMON_BASE_URL:-}"
      EFFICIENT_DAEMON_MODEL: "${EFFICIENT_DAEMON_MODEL:-}"
      EFFICIENT_DAEMON_API_KEY: "${EFFICIENT_DAEMON_API_KEY:-}"
      EFFICIENT_DAEMON_REASONING_EFFORT: "${EFFICIENT_DAEMON_REASONING_EFFORT:-}"
      EFFICIENT_DAEMON_TEMPERATURE: "${EFFICIENT_DAEMON_TEMPERATURE:-}"
      EFFICIENT_DAEMON_MAX_TOKENS: "${EFFICIENT_DAEMON_MAX_TOKENS:-}"
      EFFICIENT_DAEMON_TIMEOUT: "${EFFICIENT_DAEMON_TIMEOUT:-}"
      EFFICIENT_DAEMON_MAX_SCORE_LEVELS: "${EFFICIENT_DAEMON_MAX_SCORE_LEVELS:-}"
      EFFICIENT_DAEMON_WORKBENCH: "${EFFICIENT_DAEMON_WORKBENCH:-true}"
